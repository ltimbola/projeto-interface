<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HABIT – Entrar</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/assinar.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="HABIT – página inicial">HABIT</a>
      <nav class="site-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="#">Páginas</a>
        <a href="destaques.html">Destaques</a>
        <a href="assinar.html">Assinar</a>
        <a href="admin-categorias.html" class="nav-admin">Admin</a>
      </nav>
      <form id="search-form" class="header-search" role="search" aria-label="Busca no site">
        <label for="busca" class="visually-hidden">Buscar</label>
        <input type="search" id="busca" name="q" placeholder="Buscar..." aria-label="Campo de busca" />
        <button type="submit" class="btn btn-outline-neutral">Buscar</button>
        <a href="entrar.html" class="btn btn-outline-neutral" aria-current="page">Entrar</a>
      </form>
    </div>
  </header>

  <main id="main-content">
    <div class="container">
      <div class="main-wrapper">
        <div class="form-page">

          <section class="form-card" aria-labelledby="login-title">
            <h1 id="login-title">Entrar</h1>

            <form id="login-form" novalidate>
              <div class="form-field">
                <label for="login-email">E-mail</label>
                <input
                  type="email"
                  id="login-email"
                  name="email"
                  class="form-input"
                  placeholder="E-mail"
                  autocomplete="email"
                  required
                  aria-required="true"
                />
              </div>

              <div class="form-field">
                <label for="login-senha">Senha</label>
                <input
                  type="password"
                  id="login-senha"
                  name="senha"
                  class="form-input"
                  placeholder="Senha"
                  autocomplete="current-password"
                  required
                  aria-required="true"
                />
              </div>

              <div class="auth-actions">
                <button type="submit" class="btn btn-primary">Entrar</button>
                <button type="button" class="btn btn-outline">Entrar com Google</button>
              </div>

              <p class="auth-links">
                <a href="#">Esqueci a senha</a>
                <span class="sep">•</span>
                <a href="criar-conta.html">Criar conta</a>
              </p>

              <p id="login-feedback" class="form-feedback" aria-live="polite"></p>
            </form>
          </section>

        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer-social" role="contentinfo">
    <div class="container">
      <nav class="footer-social-links" aria-label="Links de redes sociais">
        <a href="#">Instagram</a>
        <a href="#">Work</a>
        <a href="#">Bags</a>
        <a href="#">Lamp</a>
        <a href="#">Books</a>
      </nav>
    </div>
    <p class="footer-copyright">© 2025 Meu Site • Meu site</p>
  </footer>

  <script src="../controllers/entrarController.js"></script>
</body>
</html>
